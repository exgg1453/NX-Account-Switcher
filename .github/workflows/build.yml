name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Resolve latest Legacy Fabric yarn build
        run: |
          LATEST_BUILD=$(curl -fsSL "https://meta.legacyfabric.net/v2/versions/yarn/1.12.2" | jq -r '.[0].build' || true)
          if [ -n "$LATEST_BUILD" ] && [ "$LATEST_BUILD" != "null" ]; then
            sed -i "s/^yarn_build=.*/yarn_build=${LATEST_BUILD}/" gradle.properties
          fi
          grep yarn_build gradle.properties

      - name: Build mod
        id: gradle_build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Create error report
        if: failure()
        run: |
          {
            echo "NX Account Switcher build failed"
            echo "Commit: ${GITHUB_SHA}"
            echo
            grep -nE "error:|ERROR|FAILURE|What went wrong|Caused by|Exception" build.log | head -n 200 || true
            echo
            echo "===== Last 300 lines of build log ====="
            tail -n 300 build.log || true
          } > error.txt

      - name: Annotate build errors
        if: failure()
        run: |
          python3 - <<'PYEOF'
          lines = open("error.txt", encoding="utf-8", errors="replace").read().splitlines()
          chunks = [lines[i:i + 120] for i in range(0, min(len(lines), 600), 120)]
          for index, chunk in enumerate(chunks):
              message = "%0A".join(line.replace("%", "%25").replace("\r", "") for line in chunk)
              print("::error title=Build error part %d::%s" % (index + 1, message))
          PYEOF

      - name: Upload error report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error
          path: error.txt

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NX-Account-Switcher
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
